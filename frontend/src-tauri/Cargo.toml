[package]
name = "ligora"
version = "0.1.0"
description = "Ligora - Molecular analysis workstation"
authors = ["Ligora contributors"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "ligora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
