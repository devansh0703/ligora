name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install numpy requests pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Test import
        run: |
          cd backend
          python -c "from ligora_backend import Config, StructureParser, LigandResolver, ContactAnalyzer; print('Imports OK')"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install numpy requests pytest ruff

      - name: Run ruff lint
        run: |
          cd backend
          ruff check . --select E,F,W --ignore E501

      - name: Run ruff format check
        run: |
          cd backend
          ruff format . --check

  build-snap:
    runs-on: ubuntu-latest
    needs: [python-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Install snapcraft
        run: |
          sudo apt update
          sudo apt install -y snapcraft

      - name: Build snap (dry run)
        run: |
          cd snap
          snapcraft --dry-run

      - name: Verify snapcraft.yaml
        run: |
          cd snap
          snapcraft help-build 2>&1 | head -20 || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Check frontend build
        run: |
          cd frontend
          npx tauri build --no-bundle 2>&1 | tail -30 || true

  acceptance-checks:
    runs-on: ubuntu-latest
    needs: [python-tests, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test backend
        run: |
          cd backend
          pip install numpy requests
          
          # Test that all modules can be imported
          python -c "
import sys
sys.path.insert(0, '.')

from ligora_backend.config import Config, get_config
from ligora_backend.workspace import WorkspaceManager, Session
from ligora_backend.parser import StructureParser
from ligora_backend.ligand import LigandResolver
from ligora_backend.contacts import ContactAnalyzer
from ligora_backend.cheminformatics import Cheminformatics
from ligora_backend.enrichment import EnrichmentClient
from ligora_backend.engines import EngineRegistry, VinaAdapter, GninaAdapter
from ligora_backend.jobs import JobManager
from ligora_backend.export import ArtifactExporter
from ligora_backend.server import BackendServer

print('All modules imported successfully')

# Test basic functionality
config = Config()
assert config.base_dir is not None
print(f'Config base dir: {config.base_dir}')

parser = StructureParser()
workspace = WorkspaceManager(config.workspace_dir)
session = workspace.create_session()
print(f'Session created: {session.id}')

vina = VinaAdapter()
vina_available = vina.discover()
print(f'Vina available: {vina_available}')

print('All acceptance checks passed')
"
