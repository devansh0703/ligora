name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system tools used by the backend
        run: |
          sudo apt-get update
          sudo apt-get install -y openbabel autodock-vina

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install numpy scipy requests pytest ruff rdkit plip

      - name: Run ruff lint
        run: |
          cd backend
          ruff check . --select E,F,W --ignore E501

      - name: Run tests (live services + real tools)
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Test imports
        run: |
          cd backend
          python -c "from ligora_backend.server import BackendServer; print('Imports OK')"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend (vite)
        run: |
          cd frontend
          npm run build

      - name: Build Tauri Rust bridge (compile check)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          cd frontend/src-tauri
          cargo check

      - name: Rust format/clippy informational
        run: |
          cd frontend/src-tauri
          cargo clippy 2>&1 | tail -20 || true

  build-snap:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-build]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          # snapcraft needs the full checkout to reach ../backend and ../frontend
          fetch-depth: 0

      - name: Install snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Build snap
        run: |
          cd snap
          snapcraft
