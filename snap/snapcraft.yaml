name: ligora
version: '0.1.0'
summary: Molecular analysis workstation
description: |
  Ligora is a molecular analysis workstation for protein-ligand interaction analysis.
  
  Features:
  - Open and visualize PDB/mmCIF structures
  - Detect and analyze protein-ligand contacts
  - Run molecular docking with AutoDock Vina
  - Enrich ligand data from PubChem, ChEMBL, PDBBind
  - Export analysis artifacts

confinement: strict
grade: stable
base: core22

# Architectures
architectures:
  - build-on: amd64
    run-on: amd64

# Parts
parts:
  # Python backend
  ligora-backend:
    plugin: python
    python-requirements:
      - requirements.txt
    source: ../backend


    build-packages:
      - python3
      - python3-pip
      - python3-numpy
      - python3-dev
      - libjpeg-dev
      - zlib1g-dev
      - libfreetype6-dev
      - libpng-dev
    stage-packages:
      - python3
      - python3-numpy
      - python3-requests
      - python3-pil
      - python3-tk

  # Tauri application
  ligora-app:
    plugin: nil
    source: ../frontend
    build-snaps:
      - node/20/stable
    build-packages:
      - curl
      - wget
      - libssl-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
    override-build: |
      # Install Node.js
      export PATH="$PATH:$HOME/.local/share/snapd/snap/bin"
      
      # Install dependencies
      cd "$SNAPCRAFT_PART_SRC"
      npm install
      
      # Build Tauri application
      npm run tauri build
      
      # Copy output to stage
      mkdir -p "$SNAPCRAFT_PART_INSTALL"
      cp -r src-tauri/target/release/bundle/* "$SNAPCRAFT_PART_INSTALL/"
    stage-packages:
      - libgtk-3-0
      - libgdk-pixbuf2.0-0
      - libayatana-appindicator3-1
      - libasound2
      - libnss3
      - libxss1
      - libx11-6
      - libgl1-mesa-glx
      - libxcb-randr0
      - libxcb-xinerama0
      - libxcb-shape0

  # AutoDock Vina (open source, Apache 2.0)
  vina:
    plugin: nil
    build-packages:
      - g++-11
      - cmake
      - zlib1g-dev
      - libxml2-dev
      - libboost-graph-dev
      - libboost-program-options-dev
    override-build: |
      set -x
      cd /tmp
      curl -fsSL -o vina-src.zip \
        "https://github.com/ccsb-scripps/autoDock-Vina/archive/refs/tags/v1.2.3.zip"
      unzip -o vina-src.zip
      cd autoDock-Vina-1.2.3

      mkdir -p build && cd build
      cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release \
        -DXMLPP_ROOT=/usr
      make -j$(nproc)
      make install

      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"
      cp /usr/local/bin/vina "$SNAPCRAFT_PART_INSTALL/bin/"
      cp -r /usr/local/share/vina* "$SNAPCRAFT_PART_INSTALL/share/" 2>/dev/null || true
    stage-packages: []

  # PLIP (GPL, for contact analysis)
  plip:
    plugin: python
    python-requirements:
      - ./plip-requirements.txt
    source: plip-source
    build-packages:
      - python3-dev
      - python3-setuptools
    stage-packages:
      - python3

  # Icon files
  icon:
    plugin: nil
    source: icons
    override-build: |
      mkdir -p "$SNAPCRAFT_PART_INSTALL/meta/"
      cp -r "$SNAPCRAFT_PART_SRC"/* "$SNAPCRAFT_PART_INSTALL/"
    stage-packages: []

# Apps
apps:
  ligora:
    command: bin/ligora
    extensions:
      - gnome
    environment:
      LIGORA_BASE_DIR: $SNAP_USER_COMMON
      LIGORA_DATA_DIR: $SNAP_USER_DATA
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      PYTHONPATH: $SNAP/lib/python3/dist-packages:$SNAP/usr/lib/python3/dist-packages
      LD_LIBRARY_PATH: $SNAP/usr/lib:$SNAP_LIBRARY_PATH
      RDKIT_BASE: $SNAP/usr
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
      - home
      - network
      - shell
      - removable-media

# Plugs
plugs:
  shell:
    interface: shell
    command-chain:
      - bin/init-shell

# Extra files to include
extra-files:
  - snap/local/bin/init-shell
  - snap/local/bin/ligora-wrapper

# Build options
build-options:
  build-snaps:
    - node/20/stable
  build-packages:
    - python3
    - python3-pip
    - python3-venv
    - cmake
    - g++
    - libgtk-3-dev
    - nodejs

# Grade and confinement settings
grade: devel
confinement: classic
