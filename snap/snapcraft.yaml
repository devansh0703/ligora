name: ligora
version: '0.1.0'
summary: Molecular analysis workstation
description: |
  Ligora is a molecular analysis workstation for protein-ligand interaction
  analysis built on open data sources and open engines.

  Features:
  - Open and visualize PDB/mmCIF, mol2, SDF/MOL, XYZ, GRO and PDBQT files
  - Real protein-ligand contact analysis via PLIP
  - Molecular docking with AutoDock Vina
  - GROMACS minimization / short-MD snippets
  - Pocket detection (fpocket) and DSSP secondary structure
  - Real geometry cleanup and PDBQT preparation via Open Babel
  - Live ligand enrichment from RCSB CCD, PubChem, ChEMBL, UniChem, BindingDB
  - Batch analysis, water networks, 2D editor, scripting console
  - Export analysis artifacts (JSON summary, contacts CSV, ligand SDF,
    mmCIF struct_conn, reproducibility manifest)

grade: stable
confinement: strict
base: core22

architectures:
  - amd64

apps:
  ligora:
    command: bin/ligora-wrapper
    extensions: [gnome]
    environment:
      LIGORA_BASE_DIR: $SNAP_USER_COMMON
      # Python backend package shipped inside the snap.
      LIGORA_BACKEND_DIR: $SNAP/usr/lib/ligora-backend
      # python3 from the core22 base.
      LIGORA_PYTHON: $SNAP/usr/bin/python3
      # Engine executables staged from real distro packages below.
      PATH: $SNAP/usr/bin:$SNAP/bin:$PATH
      PLIP_PATH: $SNAP/usr/bin/plip
    plugs:
      - desktop
      - x11
      - wayland
      - opengl
      - home
      - network

parts:
  ligora-backend:
    plugin: python
    source: ../backend
    python-requirements: [requirements.txt]
    build-packages:
      - python3-dev
      - libjpeg-dev
      - zlib1g-dev
      - libfreetype6-dev
      - libpng-dev
    override-pull: |
      craftctl default
      # Keep the python plugin's site-packages layout predictable.
      craftctl set env "PIP_NO_WARN_SCRIPT_LOCATION=1"
    override-build: |
      craftctl default
      # Expose the package where the wrapper and Rust bridge expect it.
      mkdir -p "$SNAPCRAFT_PART_INSTALL/usr/lib/ligora-backend"
      site="$SNAPCRAFT_PART_INSTALL/lib/python3.10/site-packages"
      if [ -d "$site/ligora_backend" ]; then
        cp -r "$site/ligora_backend" \
          "$SNAPCRAFT_PART_INSTALL/usr/lib/ligora-backend/"
      fi

  ligora-app:
    plugin: nil
    source: ../frontend
    build-snaps: [node/20/stable]
    build-packages:
      - curl
      - libssl-dev
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - patchelf
    override-build: |
      set -x
      cd "$SNAPCRAFT_PART_SRC"
      npm install
      # Build the Tauri app (frontend + Rust bridge) without bundling debs.
      npx tauri build --no-bundle
      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"
      cp src-tauri/target/release/ligora "$SNAPCRAFT_PART_INSTALL/bin/ligora"

  engines:
    plugin: nil
    stage-packages:
      # Real analysis engines from the distro - the backend detects and
      # uses them; when absent it reports unavailability, never fakes.
      - autodock-vina
      - plip
      - openbabel
      # MD minimization / short-MD snippets (gmx; user-configurable via
      # LIGORA_GMX_PATH, discovered on PATH by default).
      - gromacs
      # Secondary-structure assignment (provides mkdssp).
      - dssp
      # fpocket is NOT in Ubuntu repositories: it needs an upstream build
      # (e.g. a staged part from source or the fpocket snap). Until then
      # the pockets feature reports fpocket as unavailable - honestly.
      # Runtime libraries the engines and GUI need.
      - libxml2
      - zlib1g
      - libboost-program-options1.74
      - libboost-serialization1.74
      - libboost-system1.74
      - libboost-graph1.74
      # Python runtime for the backend process (base core22 provides it,
      # listed explicitly so the wrapper's interpreter is guaranteed).
      - python3
      - python3-minimal
      - libpython3.10-stdlib
      - libpython3.10-minimal
      # 3D rendering stack used by the webview and WebGL viewer.
      - libgl1
      - libegl1
      - libnss3
      - libxss1
      - libgbm1
      - libasound2
      - libatk-bridge2.0-0
      - libatk1.0-0
      - libcups2
      - libxkbcommon0
      - libatspi2.0-0
      - libdrm2
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libpango-1.0-0
      - libcairo2
      - libgdk-pixbuf-2.0-0

  wrappers:
    plugin: dump
    source: .
    override-build: |
      set -x
      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"
      cat > "$SNAPCRAFT_PART_INSTALL/bin/ligora-wrapper" <<'EOF'
      #!/bin/bash
      # Ligora snap launcher: wires the real engine paths and starts the
      # Tauri app, which spawns the Python backend via LIGORA_* variables.
      export LIGORA_BASE_DIR="${LIGORA_BASE_DIR:-$SNAP_USER_COMMON}"
      export LIGORA_BACKEND_DIR="$SNAP/usr/lib/ligora-backend"
      export LIGORA_PYTHON="$SNAP/usr/bin/python3"
      export PATH="$SNAP/usr/bin:$SNAP/bin:$PATH"
      export PLIP_PATH="$SNAP/usr/bin/plip"
      # Open Babel needs its own share dir for format plugins.
      export BABEL_DATADIR="$SNAP/usr/share/openbabel"
      export LD_LIBRARY_PATH="$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$LD_LIBRARY_PATH"
      exec "$SNAP/bin/ligora" "$@"
      EOF
      chmod +x "$SNAPCRAFT_PART_INSTALL/bin/ligora-wrapper"
